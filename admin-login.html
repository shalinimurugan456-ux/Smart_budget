
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Sign In – PocketSmart AI</title>
  <meta name="description" content="Sign in to the PocketSmart AI administrative management console.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color: #0f172a;">

  <div class="auth-wrapper" style="min-height: 100vh;">
    <div class="auth-card" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border-color: rgba(255, 255, 255, 0.1);">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 1.5rem;">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          </div>
          <span>Pocket<span class="highlight">Smart</span></span>
          <span class="brand-badge" style="background: linear-gradient(135deg, #ef4444, #f97316);">ADMIN</span>
        </a>

        <div class="auth-demo-badge" style="background: #fee2e2; color: #991b1b; border-color: #fca5a5;">
          Administrative Control Console
        </div>
        <h2>Admin Authentication</h2>
        <p>Sign in to manage catalog recommendations, view user stats, and analyze metrics.</p>
      </div>

      <div style="background: var(--surface-subtle); border: 1px dashed var(--border-color); border-radius: var(--radius-md); padding: 0.85rem 1rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 0.82rem;">
          Admin: <strong>admin</strong> / <strong>12345</strong>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="fillAdminCredsBtn" style="padding: 0.25rem 0.65rem; font-size: 0.78rem;">
          Auto-fill
        </button>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminUsername">Admin Username <span class="required">*</span></label>
          <input type="text" class="form-control" id="adminUsername" name="username" placeholder="admin" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Password <span class="required">*</span></label>
          <input type="password" class="form-control" id="adminPassword" name="password" placeholder="12345" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitAdminBtn">
          Enter Admin Portal
        </button>
      </form>

      <div class="auth-footer">
        <a href="index.html">&larr; Return to Public Website</a>
        <span style="margin: 0 0.5rem; color: var(--border-color);">|</span>
        <a href="login.html">User Login</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('adminLoginForm');
      const fillBtn = document.getElementById('fillAdminCredsBtn');
      const submitBtn = document.getElementById('submitAdminBtn');

      fillBtn.addEventListener('click', () => {
        document.getElementById('adminUsername').value = 'admin';
        document.getElementById('adminPassword').value = '12345';
        UI.showToast('Admin credentials populated (admin / 12345)', 'info');
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = form.username.value.trim();
        const password = form.password.value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Verifying admin role...';

        setTimeout(() => {
          try {
            AuthService.login(username, password, 'admin');
            UI.showToast('Admin session verified. Loading portal...', 'success');
            setTimeout(() => {
              window.location.href = 'admin-dashboard.html';
            }, 500);
          } catch (err) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Enter Admin Portal';
            UI.showToast(err.message, 'danger');
          }
        }, 400);
      });
    });
  </script>
</body>
</html>
